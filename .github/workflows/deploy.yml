name: Deploy to Render

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_lgd_ews
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_lgd_ews
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          python manage.py check

      - name: Run migrations
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_lgd_ews
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_lgd_ews
          SECRET_KEY: test-secret-key
          DEBUG: "False"
        run: |
          python manage.py test

      - name: Lint with flake8
        continue-on-error: true
        run: |
          pip install flake8
          flake8 accounts api incidents lgd_ews --max-line-length=120 --exclude=migrations

  deploy-to-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_KEY: ${{ secrets.RENDER_DEPLOY_KEY }}
        run: |
          if [ -z "$RENDER_DEPLOY_KEY" ]; then
            echo "RENDER_DEPLOY_KEY not set. Configure it in GitHub Secrets."
            exit 1
          fi
          # Trigger Render deployment via webhook
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_SERVICE_ID }}?key=$RENDER_DEPLOY_KEY

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
