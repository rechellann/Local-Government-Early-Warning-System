<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LGU Hazard Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

</head>

<style>

body{
    background:#f5f7fb;
    font-family:'Segoe UI',sans-serif;
}

.sidebar{
    position:fixed;
    width:260px;
    height:100vh;
    background:linear-gradient(180deg,#0b5ed7,#084298);
    color:white;
    padding:20px;
}

.logo-box{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
}

.logo-box img{
    width:45px;
}

.sidebar a{
    display:flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:white;
    padding:12px 15px;
    border-radius:10px;
    margin-bottom:8px;
    transition:.3s;
}

.sidebar a:hover{
    background:rgba(255,255,255,.15);
}

.sidebar a.active{
    background:#0d6efd;
}

.main-content{
    margin-left:260px;
    padding:25px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.stats-card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.stats-card .value{
    font-size:32px;
    font-weight:700;
}

.stats-card .icon{
    width:45px;
    height:45px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    border:none;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.table td,
.table th{
    vertical-align:middle;
}

.badge-active{
    background:#198754;
}

.badge-warning{
    background:#fd7e14;
}

.badge-danger{
    background:#dc3545;
}

.user-box{
    position:absolute;
    bottom:20px;
    left:20px;
    right:20px;
    background:rgba(255,255,255,.1);
    padding:10px;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo-box">
        <img src="{% static 'images/logo.png' %}" alt="LGU Hazard Management System logo">
        <div>
            <strong>LGU Hazard</strong><br>
            Management System
        </div>
    </div>

    <a href="{% url 'admin_dashboard' %}" class="active">
        <i class="fas fa-chart-line"></i>
        Dashboard
    </a>

    <a href="{% url 'incident_management' %}">
        <i class="fas fa-triangle-exclamation"></i>
        Incident Management
    </a>

    <a href="{% url 'sensor_monitoring' %}">
        <i class="fas fa-tower-broadcast"></i>
        Sensor Monitoring
    </a>

    <a href="#">
        <i class="fas fa-users"></i>
        User Management
    </a>

    <a href="{% url 'reports_analytics' %}">
        <i class="fas fa-file"></i>
        Reports & Analytics
    </a>

    <a href="{% url 'audit_log' %}">
        <i class="fas fa-shield"></i>
        Audit Logs
    </a>

    <a href="#">
        <i class="fas fa-gear"></i>
        System Settings
    </a>

    <div class="user-box">
        <strong>Juan Dela Cruz</strong><br>
        LGU Administrator
    </div>

</div>

<div class="main-content">

{% block content %}
{% endblock %}

</div>

</body>
</html>
